name: Feature request
description: Suggest a new skill, reference or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the job you want help with, not the solution
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: textarea
    id: sources
    attributes:
      label: Sources or examples
      description: Links to anything that shows the need or the right approach
