name: Bug report
description: Something in a skill, install script or command does not work as described
labels: [bug]
body:
  - type: input
    id: client
    attributes:
      label: Which client are you using?
      description: Claude Code, Codex, Gemini CLI, Cursor, Windsurf, Copilot, Cline, Aider, an MCP client, or a plain system prompt
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and Node version
      placeholder: "Windows 11, Node 22.x"
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact command you ran or request you made, and what you saw
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem
