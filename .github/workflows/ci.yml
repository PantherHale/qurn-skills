name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        shell: bash
        run: node --test $(find . -name '*.test.mjs' -not -path './.git/*' -not -path '*/node_modules/*')
      - name: Flatten files match the skills
        run: node scripts/build-flatten.mjs --check
